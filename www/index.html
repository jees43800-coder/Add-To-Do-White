<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no, interactive-widget=resizes-content" />
<title>Add To Do</title>
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="theme-color" content="#141414" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    overflow: hidden; overscroll-behavior: none;
    background: #0a0a0a;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  #app {
    height: 100dvh; width: 100%;
    background: #141414;
    display: flex; flex-direction: column;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }
  header { padding: 22px 14px 10px 14px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; }
  header h1 {
    color: #F4F3EF; font-size: 30px; font-weight: 700;
    letter-spacing: -0.02em; margin: 0;
  }
  #history-btn, #emoji-edit-btn {
    width: 45px; height: 40px; border-radius: 20px;
    background: #1F1F1F; border: 1px solid #2A2A2A;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0;
  }
  #history-btn svg { flex-shrink: 0; }
  #ad-banner-top {
    height: 50px; flex-shrink: 0;
    background: #1F1F1F; border-bottom: 1px dashed #3A3A3A;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  #ad-banner-top img { width: 320px; height: 50px; object-fit: cover; display: block; transform: scale(1.15); }
  #list {
    flex: 1; min-height: 0; overflow-y: auto; padding: 6px 14px;
    display: flex; flex-direction: column; gap: 8px;
    -webkit-overflow-scrolling: touch;
  }
  .row-wrap {
    position: relative; height: 72px; border-radius: 16px;
    overflow: hidden; flex-shrink: 0;
  }
  .reveal {
    position: absolute; inset: 0; display: flex; align-items: center;
  }
  .reveal.right { justify-content: flex-start; padding-left: 18px; background: #2E8A57; }
  .reveal.left { justify-content: flex-end; padding-right: 18px; background: #C0473A; }
  .row {
    position: relative; height: 100%; background: #1F1F1F;
    border: 1px solid transparent; border-radius: 16px;
    display: flex; align-items: center; gap: 12px; padding: 0 16px;
    touch-action: none; user-select: none; cursor: grab;
  }
  .emoji-slot { width: 26px; height: 26px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 18px; }
  .task-text {
    flex: 1; color: #F4F3EF; font-size: 15px; line-height: 19px; font-weight: 400;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  #undo-toast {
    position: absolute; bottom: 92px; left: 50%; transform: translateX(-50%);
    background: #1F1F1F; border: 1px solid #2E2E2E; border-radius: 999px;
    padding: 8px 16px; display: none; align-items: center; box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    z-index: 50;
  }
  #undo-toast.show { display: flex; animation: toastIn 0.18s ease-out; }
  @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(6px);} to { opacity: 1; transform: translateX(-50%) translateY(0);} }
  #undo-btn { background: none; border: none; padding: 0; display: flex; cursor: pointer; }
  footer { padding: 12px 14px 22px 14px; flex-shrink: 0; }
  .input-bar {
    display: flex; align-items: center; background: #1B1B1B;
    border: 1px solid #2A2A2A; border-radius: 999px; padding: 6px 8px 6px 10px; gap: 2px;
  }
  #task-input {
    flex: 1; background: transparent; border: none; outline: none;
    color: #F4F3EF; font-size: 15px; margin-left: 2px;
    align-self: center; text-align: left;
  }
  #task-input::placeholder { color: #6E6E6E; font-style: italic; font-size: 16px; }
  #add-btn {
    width: 38px; height: 38px; border-radius: 50%; background: #F4F3EF; border: none;
    display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;
  }
  #emoji-toggle {
    width: 34px; height: 34px; border-radius: 50%; background: transparent; border: none;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0;
  }
  #emoji-panel {
    display: none; overflow-x: auto; white-space: nowrap; gap: 6px;
    padding: 4px 4px 10px 4px; -webkit-overflow-scrolling: touch;
  }
  #emoji-panel.show { display: flex; }
  #emoji-panel button {
    flex-shrink: 0; width: 38px; height: 38px; border-radius: 12px;
    background: #1B1B1B; border: 1px solid #2A2A2A; font-size: 18px;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .row--flash-delete { background: #F4F3EF !important; transition: background 0.15s ease; }
  .row--flash-delete .task-text,
  .row--flash-delete .emoji-slot { opacity: 0; transition: none; }
  .center-delete-icon {
    position: absolute; top: 50%; left: 50%; z-index: 5;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; transform: translate(-50%, -50%) scale(0.3);
    animation: centerDeleteZoom 0.32s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }
  @keyframes centerDeleteZoom {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.3); }
    60% { opacity: 1; transform: translate(-50%, -50%) scale(1.15); }
    100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  }
  #history-overlay {
    position: fixed; inset: 0; background: rgba(10,10,10,0.72);
    display: none; z-index: 100;
  }
  #history-overlay.show { display: block; animation: overlayIn 0.18s ease-out; }
  @keyframes overlayIn { from { opacity: 0; } to { opacity: 1; } }
  #history-panel {
    position: absolute; top: calc(env(safe-area-inset-top) + 83px);
    left: 14px; right: 14px;
    bottom: calc(86px + env(safe-area-inset-bottom));
    background: #141414;
    border-radius: 20px; border: 1px solid #2A2A2A;
    padding: 18px; display: flex; flex-direction: column;
    transform: scale(0.92); opacity: 0; transform-origin: top right;
    transition: transform 0.18s ease-out, opacity 0.18s ease-out;
    -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
  }
  #history-overlay.show #history-panel { transform: scale(1); opacity: 1; }
  .history-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 14px; flex-shrink: 0;
  }
  .history-head h2 { color: #F4F3EF; font-size: 22px; font-weight: 700; margin: 0; }
  #history-list {
    overflow-y: auto; display: flex; flex-direction: column; gap: 8px;
    -webkit-overflow-scrolling: touch;
  }
  .history-row {
    display: flex; align-items: center; gap: 10px;
    background: #1F1F1F; border-radius: 14px; padding: 10px 14px;
  }
  .history-icon {
    width: 24px; height: 24px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700;
  }
  .history-icon.tick { background: rgba(46,138,87,0.25); color: #4CC97F; }
  .history-icon.cross { background: rgba(192,71,58,0.25); color: #E5484D; }
  .history-text {
    flex: 1; color: #F4F3EF; font-size: 14px; line-height: 18px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .history-empty {
    color: #6E6E6E; font-style: italic; text-align: center;
    padding: 34px 0; font-size: 14px;
  }
</style>
</head>

        <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#9a9a9a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"/>
          <circle cx="9" cy="10" r="0.7" fill="#9a9a9a" stroke="none"/>
          <circle cx="15" cy="10" r="0.7" fill="#9a9a9a" stroke="none"/>
          <path d="M8.5 14.5c1 1.2 2.2 1.8 3.5 1.8s2.5-.6 3.5-1.8"/>
        </svg>

      <input id="task-input" placeholder="Add What To Do..." />
      <button id="add-btn" aria-label="Add task">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>

  <div id="undo-toast">
    <button id="undo-btn" aria-label="Undo">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F4F3EF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 14 4 9 9 4"/><path d="M20 20v-7a4 4 0 0 0-4-4H4"/></svg>
    </button>

    <div id="history-panel">
      <div class="history-head">
        <h2>Today</h2>
      </div>
      <div id="history-list"></div>
    </div>
  </div>
</div>

<script>
const ROW_HEIGHT = 72;
const ROW_GAP = 8; // matches the `gap` set on #list — must be included in reorder math
const ROW_PITCH = ROW_HEIGHT + ROW_GAP; // true vertical distance between two rows' positions
const REORDER_THRESHOLD = 1.1; // fraction of a row's height the drag must cross before the swap commits
const DEMO_TASKS = [
  { id: "demo1", text: "Finish maths homework", icon: "📚" },
  { id: "demo2", text: "Buy groceries for the week", icon: "🛒" },
];

const STORAGE_KEY = "todo-list-tasks";

function loadTasks() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved !== null) {
      const parsed = JSON.parse(saved);
      if (Array.isArray(parsed)) return parsed;
    }
  } catch (e) {}
  return [...DEMO_TASKS];
}

function saveTasks() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
  } catch (e) {}
}

let tasks = loadTasks();
let lastRemoved = null; // { task, index }
let lastHistoryId = null; // history entry tied to lastRemoved, cleared on undo
let undoTimer = null;
let uid = 1;
let activeGestureId = null; // guards against two rows ever handling a gesture simultaneously
let historyPanelOpen = false;
let tapTimer = null; // pending single-tap timer, held back briefly to detect a follow-up double-tap
let tapTaskId = null; // task the pending tap timer belongs to

const HISTORY_KEY = "todo-history-v1";

function todayStr() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}

function loadHistory() {
  try {
    const saved = localStorage.getItem(HISTORY_KEY);
    if (saved !== null) {
      const parsed = JSON.parse(saved);
      if (parsed && typeof parsed === "object" && Array.isArray(parsed.entries) && parsed.date === todayStr()) {
        return parsed;
      }
    }
  } catch (e) {}
  return { date: todayStr(), entries: [] };
}

function saveHistory() {
  try {
    localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
  } catch (e) {}
}

let history = loadHistory();

// Clears entries whenever the stored date no longer matches today —
// this is what makes the history a rolling 1-day window that empties
// out at midnight rather than accumulating forever.
function ensureHistoryFresh() {
  const t = todayStr();
  if (history.date !== t) {
    history = { date: t, entries: [] };
    saveHistory();
  }
}

function addHistoryEntry(task, action) {
  ensureHistoryFresh();
  const entry = { id: task.id + "-" + Date.now(), text: task.text, icon: task.icon, action };
  history.entries.push(entry);
  saveHistory();
  if (historyPanelOpen) renderHistory();
  return entry.id;
}

// Fires shortly after each midnight to wipe the history live, even if
// the app has been left open across the day boundary, then reschedules
// itself for the next midnight.
function scheduleMidnightReset() {
  const now = new Date();
  const next = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 2, 0);
  setTimeout(() => {
    ensureHistoryFresh();
    if (historyPanelOpen) renderHistory();
    scheduleMidnightReset();
  }, next - now);
}
scheduleMidnightReset();

const EMOJI_PICKER = [
  "✅", "📚", "✍️", "📝", "💻", "📞", "🤝", "📅",
  "⏰", "🛒", "📦", "🧾", "💳", "🍳", "☕", "🍽️",
  "🥗", "🧹", "🧺", "🔧", "🗑️", "🏠", "🪴", "🚗",
  "⛽", "✈️", "🚌", "🧳", "💊", "🏋️", "🧘", "🩺",
  "😴", "🚿", "💧", "🚶", "💰", "🎉", "🎁", "🎂",
  "💬", "🐾", "🎵", "🎮", "📷", "🎨", "👕", "🔑",
  "⚕️", "🧠",
];

const listEl = document.getElementById("list");
const inputEl = document.getElementById("task-input");
const addBtn = document.getElementById("add-btn");
const toastEl = document.getElementById("undo-toast");
const undoBtn = document.getElementById("undo-btn");
const emojiToggle = document.getElementById("emoji-toggle");
const emojiPanel = document.getElementById("emoji-panel");
const historyBtn = document.getElementById("history-btn");
const historyOverlay = document.getElementById("history-overlay");
const historyListEl = document.getElementById("history-list");

addTapHandler(historyBtn, () => openHistory());
// Tapping anywhere on the history screen closes it — including directly
// on a task row. Rows aren't excluded by target: the distance/duration
// check below already tells a genuine tap apart from a scroll-drag (a
// real scroll moves more than the distance threshold), so it protects
// scrolling on its own without needing to also block taps on rows. These
// listeners have no preventDefault, so they never interfere with the
// list's native touch-scroll/momentum. A long-press (even held perfectly
// still, then released) does not close it, since it fails the duration
// check.
let closeStartX = 0, closeStartY = 0, closeStartTime = 0, closeTracking = false;
historyOverlay.addEventListener("pointerdown", (e) => {
  closeStartX = e.clientX; closeStartY = e.clientY; closeStartTime = Date.now(); closeTracking = true;
});
historyOverlay.addEventListener("pointerup", (e) => {
  if (!closeTracking) return;
  closeTracking = false;
  const dist = Math.hypot(e.clientX - closeStartX, e.clientY - closeStartY);
  const held = Date.now() - closeStartTime;
  if (dist < 12 && held < 420) closeHistory();
});
historyOverlay.addEventListener("pointercancel", () => { closeTracking = false; });

function openHistory() {
  inputEl.blur();
  emojiPanel.classList.remove("show");
  ensureHistoryFresh();
  renderHistory();
  historyOverlay.classList.add("show");
  historyPanelOpen = true;
}

function closeHistory() {
  historyOverlay.classList.remove("show");
  historyPanelOpen = false;
}

function renderHistory() {
  historyListEl.innerHTML = "";
  if (history.entries.length === 0) {
    const empty = document.createElement("div");
    empty.className = "history-empty";
    empty.textContent = "Nothing here yet today.";
    historyListEl.appendChild(empty);
    return;
  }
  history.entries.forEach((entry) => {
    const row = document.createElement("div");
    row.className = "history-row";
    const text = document.createElement("div");
    text.className = "history-text";
    text.textContent = (entry.icon ? entry.icon + " " : "") + entry.text;
    row.appendChild(text);
    const badge = document.createElement("div");
    badge.className = "history-icon " + entry.action;
    badge.textContent = entry.action === "tick" ? "✓" : "✕";
    row.appendChild(badge);
    historyListEl.appendChild(row);
  });
}

let pendingIcon = null;

function setToggleIcon(icon) {
  pendingIcon = icon;
  if (icon) {
    emojiToggle.innerHTML = `<span style="font-size:18px;">${icon}</span>`;
  } else {
    emojiToggle.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9a9a9a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="9" cy="10" r="0.7" fill="#9a9a9a" stroke="none"/><circle cx="15" cy="10" r="0.7" fill="#9a9a9a" stroke="none"/><path d="M8.5 14.5c1 1.2 2.2 1.8 3.5 1.8s2.5-.6 3.5-1.8"/></svg>`;
  }
}

// A tap-vs-scroll guard: only treat it as a selection if the finger didn't
// move much between pointerdown and pointerup — otherwise a scroll gesture
// that merely starts on top of a button would fire it by accident.
function addTapHandler(el, onTap) {
  let startX = 0, startY = 0, tracking = false;
  el.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    startX = e.clientX; startY = e.clientY; tracking = true;
  });
  el.addEventListener("pointerup", (e) => {
    if (!tracking) return;
    tracking = false;
    const dist = Math.hypot(e.clientX - startX, e.clientY - startY);
    if (dist < 12) onTap(e);
  });
  el.addEventListener("pointercancel", () => { tracking = false; });
}

EMOJI_PICKER.forEach((emoji) => {
  const btn = document.createElement("button");
  btn.textContent = emoji;
  addTapHandler(btn, () => {
    setToggleIcon(emoji);
    emojiPanel.classList.remove("show");
  });
  emojiPanel.appendChild(btn);
});

addTapHandler(emojiToggle, () => {
  emojiPanel.classList.toggle("show");
});

function render() {
  listEl.innerHTML = "";
  tasks.forEach((task, index) => {
    listEl.appendChild(renderRow(task, index));
  });
}

function renderRow(task, index) {
  const wrap = document.createElement("div");
  wrap.className = "row-wrap";
  wrap.dataset.taskId = task.id;

  const row = document.createElement("div");
  row.className = "row";

  if (task.icon) {
    const emojiSlot = document.createElement("div");
    emojiSlot.className = "emoji-slot";
    emojiSlot.textContent = task.icon;
    row.appendChild(emojiSlot);
  }

  const textEl = document.createElement("div");
  textEl.className = "task-text";
  textEl.textContent = task.text;
  row.appendChild(textEl);

  wrap.appendChild(row);

  attachGestures(row, wrap, task, index);
  return wrap;
}

function attachGestures(row, wrap, task, index) {
  let dx = 0, mode = null, decided = false, startX = 0, startY = 0;
  let longPressTimer = null;
  let appliedShift = 0, startIndex = index, activePointerId = null;
  let revealEl = null;
  let safetyReleaseTimer = null;
  let scrollAnchorY = 0;
  let siblingWraps = []; // every row-wrap except the dragged one, captured at drag start
  let baseIndexOf = new Map(); // each sibling's original index, for computing live preview offsets

  function clearLP() { if (longPressTimer) clearTimeout(longPressTimer); longPressTimer = null; }

  row.addEventListener("pointerdown", (e) => {
    // Ignore secondary touch points (e.g. a palm brushing the screen while
    // swiping) and refuse to start a new gesture while another row already
    // has one in progress — this makes it structurally impossible for two
    // rows to ever resolve from what should be a single touch.
    if (!e.isPrimary || activeGestureId !== null || wrap.dataset.resolving === "1") return;
    activeGestureId = task.id;
    clearTimeout(safetyReleaseTimer);
    safetyReleaseTimer = setTimeout(() => {
      if (activeGestureId === task.id) activeGestureId = null;
    }, 5000);
    row.setPointerCapture?.(e.pointerId);
    activePointerId = e.pointerId;
    startX = e.clientX; startY = e.clientY;
    decided = false; dx = 0; appliedShift = 0;
    startIndex = tasks.findIndex(t => t.id === task.id);
    mode = null;
    longPressTimer = setTimeout(() => {
      if (!decided) {
        decided = true; mode = "reorder"; row.style.zIndex = 5; wrap.style.zIndex = 10;
        // .row-wrap normally clips (overflow:hidden) so the swipe-reveal
        // background stays confined to its rounded box. But the dragged
        // row is translated vertically *inside* this same wrap, so that
        // clipping was cutting the row out of view the moment it moved
        // past its own 72px-tall box — this is what made it disappear.
        // Let this one wrap's contents overflow for the duration of the
        // drag; restored again in finish().
        wrap.style.overflow = "visible";
        // Every sibling gets its own transform (translateY) during the
        // live-preview shift below, which promotes each of them onto its
        // own GPU layer. This wrap's z-index (10) is higher, but it has no
        // transform of its own (only its child .row does) — so without a
        // matching no-op transform here, it can stay off that layer tier
        // and paint underneath the composited siblings despite the higher
        // z-index. This keeps it on the same tier so 10 vs 1 is compared
        // correctly and the dragged card stays on top.
        wrap.style.transform = "translateZ(0)";
        row.style.transition = "box-shadow 0.18s ease, transform 0s";
        row.style.boxShadow = "0 12px 24px rgba(0,0,0,0.5)";
        // Set up a continuous live-preview transition on every OTHER row:
        // as the drag crosses each threshold, we'll just update their
        // target transform and let this one persistent transition ease
        // toward it — smooth and continuous even across fast, repeated
        // threshold crossings, unlike re-triggering a fresh animation
        // per crossing (which stutters). The actual list/array order is
        // only committed once, on release.
        const all = Array.from(listEl.children);
        baseIndexOf = new Map();
        all.forEach((w, i) => baseIndexOf.set(w, i));
        siblingWraps = all.filter(w => w !== wrap);
        // Explicit (lower) z-index on every sibling too, rather than
        // leaving them at the default "auto" — this removes any
        // ambiguity so the dragged wrap's higher value unambiguously
        // wins, regardless of DOM order, when a sibling's live-preview
        // offset happens to overlap the dragged card's stationary slot.
        siblingWraps.forEach(w => { w.style.zIndex = 1; });
        siblingWraps.forEach(w => { w.style.transition = "transform 0.24s cubic-bezier(0.22, 1, 0.36, 1)"; });
      }
    }, 320);
  });

  row.addEventListener("pointermove", (e) => {
    if (activePointerId === null) return;
    const deltaX = e.clientX - startX;
    const deltaY = e.clientY - startY;

    if (!decided) {
      if (Math.abs(deltaX) > 16 && Math.abs(deltaX) > Math.abs(deltaY) * 1.8) {
        decided = true; clearLP(); mode = "swipe";
      } else if (Math.abs(deltaY) > 36) {
        // Clearly a vertical scroll attempt — take over scrolling manually
        // below, since touch-action:none means the browser won't do it
        // for us. Threshold is deliberately generous: a finger held still
        // for the long-press window naturally drifts a few pixels, and too
        // low a value here was misreading that drift as a scroll before
        // reorder could ever trigger.
        decided = true; clearLP(); mode = "scrolling";
        scrollAnchorY = e.clientY;
      }
      return;
    }

    if (mode === "scrolling") {
      listEl.scrollTop -= (e.clientY - scrollAnchorY);
      scrollAnchorY = e.clientY;
      return;
    }

    if (mode === "swipe") {
      dx = deltaX;
      row.style.transform = `translateX(${dx}px)`;
      row.style.transition = "none";
      if (!revealEl) {
        revealEl = document.createElement("div");
        wrap.insertBefore(revealEl, row);
      }
      revealEl.className = "reveal " + (dx > 0 ? "right" : "left");
      const progress = Math.min(Math.abs(dx) / 110, 1);
      revealEl.innerHTML = dx > 0
        ? `<svg style="opacity:${progress};transform:scale(${0.6+0.4*progress})" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#F4F3EF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`
        : `<svg style="opacity:${progress};transform:scale(${0.6+0.4*progress})" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#F4F3EF" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`;
    } else if (mode === "reorder") {
      // The dragged row now tracks the raw finger position directly
      // (clamped to the list's valid range), rather than snapping to
      // whole-row steps — this is what makes it visibly slide up onto/
      // over the neighboring task as you drag, instead of teleporting
      // the instant the swap threshold below is crossed. The actual
      // list order isn't touched yet — that only happens once, on
      // release — this just updates each sibling's target offset.
      const maxShift = tasks.length - 1 - startIndex;
      const minShift = -startIndex;
      const clampedDeltaY = Math.max(minShift * ROW_PITCH, Math.min(maxShift * ROW_PITCH, deltaY));
      row.style.transform = `translateY(${clampedDeltaY}px)`;

      // A plain Math.round swaps the moment the drag crosses the halfway
      // point of a row. Requiring it to cross REORDER_THRESHOLD instead
      // means the dragged card has to visibly move up over/past the
      // neighboring task first — the sibling only steps out of the way,
      // and the swap only commits, once it's actually entered that space.
      const rawShift = deltaY / ROW_PITCH;
      const wholeShift = Math.trunc(rawShift);
      const pastThreshold = Math.abs(rawShift - wholeShift) >= REORDER_THRESHOLD;
      const shift = Math.max(minShift, Math.min(maxShift, wholeShift + (pastThreshold ? Math.sign(rawShift) : 0)));
      if (shift !== appliedShift) {
        appliedShift = shift;
        siblingWraps.forEach((w) => {
          const baseIdx = baseIndexOf.get(w);
          let offset = 0;
          if (shift > 0 && baseIdx > startIndex && baseIdx <= startIndex + shift) offset = -ROW_PITCH;
          else if (shift < 0 && baseIdx < startIndex && baseIdx >= startIndex + shift) offset = ROW_PITCH;
          w.style.transform = offset ? `translateY(${offset}px)` : "translateY(0px)";
        });
      }
    }
  });

  function finish() {
    clearLP();
    clearTimeout(safetyReleaseTimer);
    activePointerId = null;
    if (activeGestureId === task.id) activeGestureId = null;
    // A plain tap: the pointer never moved enough to decide "swipe",
    // "reorder", or "scrolling", so mode is still null here.
    const wasTap = !decided && mode === null;
    if (mode === "swipe") {
      const rowWidth = row.offsetWidth || 320;
      const threshold = rowWidth * 0.3;
      if (dx > threshold) {
        commitResolve(task.id, "tick", wrap);
        return;
      } else if (dx < -threshold) {
        commitResolve(task.id, "cross", wrap);
        return;
      } else {
        row.style.transition = "transform 0.2s ease";
        row.style.transform = "translateX(0)";
        if (revealEl) { revealEl.remove(); revealEl = null; }
      }
    }
    if (mode === "reorder") {
      if (appliedShift !== 0) {
        const [moved] = tasks.splice(startIndex, 1);
        tasks.splice(startIndex + appliedShift, 0, moved);
        saveTasks();
      }
      siblingWraps.forEach((w) => { w.style.transition = "none"; w.style.transform = ""; w.style.zIndex = ""; });
      listEl.insertBefore(wrap, siblingWraps[startIndex + appliedShift] || null);
      wrap.style.overflow = "";
      wrap.style.transform = "";
    }
    row.style.zIndex = ""; wrap.style.zIndex = "";
    row.style.transition = "transform 0.2s ease, box-shadow 0.2s ease";
    row.style.boxShadow = "none";
    row.style.transform = "none";
    mode = null; decided = false;
    if (wasTap) {
      if (tapTimer && tapTaskId === task.id) {
        // A second tap landed on the same task while its first tap was
        // still pending — this is the double-tap.
        clearTimeout(tapTimer);
        tapTimer = null; tapTaskId = null;
        triggerDoubleTapDelete(task, wrap, row);
      } else {
        // A single tap does nothing on its own; just hold briefly to see
        // whether a follow-up tap arrives and turns this into a double-tap.
        tapTaskId = task.id;
        tapTimer = setTimeout(() => {
          tapTimer = null; tapTaskId = null;
        }, 260);
      }
    }
  }

  row.addEventListener("pointerup", finish);
  row.addEventListener("pointercancel", finish);
}

function triggerDoubleTapDelete(task, wrap, row) {
  wrap.dataset.resolving = "1"; // block new gestures for the ~380ms flash before commitResolve takes over

  row.classList.add("row--flash-delete");
  const centerIcon = document.createElement("div");
  centerIcon.className = "center-delete-icon";
  centerIcon.innerHTML = `<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#B8342A" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>`;
  wrap.appendChild(centerIcon);

  setTimeout(() => commitResolve(task.id, "cross", wrap, true), 380);
}

function commitResolve(id, action, wrap, skipHistory) {
  wrap.dataset.resolving = "1";
  wrap.style.transition = "opacity 0.14s ease, transform 0.14s ease";
  wrap.style.opacity = "0";
  wrap.style.transform = "scale(0.94)";
  setTimeout(() => resolveTask(id, wrap, action, skipHistory), 140);
}

function resolveTask(id, wrapEl, action, skipHistory) {
  const idx = tasks.findIndex(t => t.id === id);
  if (idx === -1) return;
  const task = tasks[idx];
  tasks = tasks.filter(t => t.id !== id);
  lastRemoved = { task, index: idx };
  lastHistoryId = skipHistory ? null : addHistoryEntry(task, action || "cross");
  showUndo();
  saveTasks();
  // Remove just this row's own element directly, rather than calling
  // render() and rebuilding every row — a full rebuild would also destroy
  // and recreate any OTHER row's DOM node, silently breaking a gesture
  // that might still be in progress on it at this exact moment.
  if (wrapEl && wrapEl.parentNode) {
    wrapEl.remove();
  } else {
    render();
  }
}

function showUndo() {
  if (undoTimer) clearTimeout(undoTimer);
  toastEl.classList.add("show");
  undoTimer = setTimeout(() => {
    toastEl.classList.remove("show");
    lastRemoved = null;
    lastHistoryId = null;
  }, 3000);
}

addTapHandler(undoBtn, () => {
  if (!lastRemoved) return;
  tasks.splice(Math.min(lastRemoved.index, tasks.length), 0, lastRemoved.task);
  if (lastHistoryId) {
    ensureHistoryFresh();
    history.entries = history.entries.filter(e => e.id !== lastHistoryId);
    saveHistory();
    if (historyPanelOpen) renderHistory();
    lastHistoryId = null;
  }
  if (undoTimer) clearTimeout(undoTimer);
  toastEl.classList.remove("show");
  lastRemoved = null;
  saveTasks();
  render();
});

function addTask() {
  const val = inputEl.value.trim();
  if (!val) return;
  inputEl.value = "";
  tasks.push({ id: "t" + (uid++), text: val, icon: pendingIcon });
  setToggleIcon(null);
  emojiPanel.classList.remove("show");
  saveTasks();
  render();
}

addBtn.addEventListener("click", addTask);
inputEl.addEventListener("keydown", (e) => { if (e.key === "Enter") addTask(); });

render();

// Register service worker for offline support
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("service-worker.js").catch(() => {});
  });
}
</script>
</body>
</html>
